name: Acorn Engine Build

on:
  push:
    branches: [main, experimental]
  pull_request:
    branches: [main, experimental]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acorn-engine-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildWindows:
    name: Windows EXE
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe and Neko
        shell: pwsh
        run: |
          choco install neko --version=2.3.0 -y --no-progress
          $zip = "$env:TEMP\haxe.zip"
          Invoke-WebRequest -Uri "https://github.com/HaxeFoundation/haxe/releases/download/4.3.4/haxe-4.3.4-win64.zip" -OutFile $zip
          if (Test-Path "C:\haxe") { Remove-Item "C:\haxe" -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath "C:\haxe"
          $root = Get-ChildItem "C:\haxe" -Directory | Select-Object -First 1
          if ($root) {
            Move-Item "$($root.FullName)\*" "C:\haxe" -Force
            Remove-Item $root.FullName -Recurse -Force
          }
          $env:Path = "C:\haxe;C:\ProgramData\chocolatey\bin;$env:Path"
          $env:HAXE_STD_PATH = "C:\haxe\std"
          "PATH=C:\haxe;C:\ProgramData\chocolatey\bin;$env:Path" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HAXE_STD_PATH=C:\haxe\std" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not (Test-Path "C:\haxe\std\std.ndll")) { throw "Haxe std.ndll is missing" }
          haxe --version
          haxelib version
          neko -version

      - name: Install Haxe dependencies
        shell: cmd
        run: setup\windows.bat

      - name: Create version
        shell: pwsh
        run: Set-Content -Path VERSION -Value "0.1.0-${{ github.run_number }}"

      - name: Compile Windows
        shell: cmd
        run: haxelib run lime build Project.xml windows --app-version="0.1.0-${{ github.run_number }}" -D officialBuild

      - name: Publish Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AcornEngine-Windows
          path: export/release/windows/bin
          if-no-files-found: error

  buildAndroid:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER=""
          for p in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; do
            if [ -x "$p" ]; then SDKMANAGER="$p"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found"
            find /usr/local/lib/android /opt -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi
          SDK_ROOT="$(dirname "$(dirname "$SDKMANAGER")")"
          SDK_ROOT="$(dirname "$SDK_ROOT")"
          echo "Using Android SDK: $SDK_ROOT"
          echo "ANDROID_SDK=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Haxe and Neko
        run: |
          sudo apt-get update
          sudo apt-get install -y neko libvlc-dev libvlccore-dev
          curl -L --fail https://github.com/HaxeFoundation/haxe/releases/download/4.3.4/haxe-4.3.4-linux64.tar.gz -o /tmp/haxe.tar.gz
          sudo rm -rf /opt/haxe
          sudo mkdir -p /opt/haxe
          sudo tar -xzf /tmp/haxe.tar.gz -C /opt/haxe --strip-components=1
          echo "/opt/haxe" >> "$GITHUB_PATH"
          echo "HAXE_STD_PATH=/opt/haxe/std" >> "$GITHUB_ENV"
          export PATH="/opt/haxe:$PATH"
          export HAXE_STD_PATH="/opt/haxe/std"
          haxe --version
          haxelib version

      - name: Install Haxe dependencies
        run: |
          haxelib setup "$HOME/haxelib"
          sh ./setup/unix.sh

      - name: Prepare Lime Android
        run: haxelib run lime setup android

      - name: Create version
        run: echo "0.1.0-${{ github.run_number }}" > VERSION

      - name: Compile Android APK
        run: haxelib run lime build Project.xml android --app-version="0.1.0-${{ github.run_number }}" -D officialBuild

      - name: Publish Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AcornEngine-Android
          path: |
            export/release/android/bin/*.apk
            export/android/bin/*.apk
          if-no-files-found: error
