name: Acorn Engine Build

on:
  push:
    branches: [main, experimental]
  pull_request:
    branches: [main, experimental]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acorn-engine-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildWindows:
    name: Windows EXE
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe and Neko
        shell: pwsh
        run: |
          choco install haxe --version=4.3.4 -y --no-progress
          choco install neko --version=2.3.0 -y --no-progress
          refreshenv

          $haxeExe = Get-ChildItem "C:\ProgramData\chocolatey\lib\haxe" -Filter haxe.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $haxeExe) { throw "haxe.exe not found after installation" }
          $haxeRoot = $haxeExe.Directory.FullName

          $stdPath = Join-Path $haxeRoot "std"
          if (-not (Test-Path $stdPath)) {
            $stdDir = Get-ChildItem "C:\ProgramData\chocolatey\lib\haxe" -Directory -Filter std -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($stdDir) { $stdPath = $stdDir.FullName }
          }
          if (-not (Test-Path $stdPath)) { throw "Haxe std directory not found" }

          $env:Path = "$haxeRoot;C:\ProgramData\chocolatey\bin;$env:Path"
          $env:HAXE_STD_PATH = $stdPath
          "PATH=$haxeRoot;C:\ProgramData\chocolatey\bin;$env:Path" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "HAXE_STD_PATH=$stdPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          haxe --version
          haxelib version
          neko -version

      - name: Install Haxe dependencies
        shell: cmd
        run: call setup\windows.bat

      - name: Create version
        shell: pwsh
        run: Set-Content -Path VERSION -Value "0.1.0-${{ github.run_number }}"

      - name: Compile Windows
        shell: cmd
        run: call haxelib run lime build Project.xml windows --app-version="0.1.0-${{ github.run_number }}" -D officialBuild

      - name: Stage Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build-artifacts\windows | Out-Null
          $files = Get-ChildItem -Path export -Recurse -Filter *.exe -File -ErrorAction SilentlyContinue
          if (-not $files) { throw "Windows EXE was not produced" }
          $files | Copy-Item -Destination build-artifacts\windows -Force

      - name: Publish Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcornEngine-Windows
          path: build-artifacts/windows/*.exe
          if-no-files-found: error

  buildAndroid:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER=""
          for p in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"; do
            if [ -x "$p" ]; then SDKMANAGER="$p"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found"
            find /usr/local/lib/android /opt -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          SDK_ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$SDKMANAGER")")")")"
          echo "Using Android SDK: $SDK_ROOT"
          echo "ANDROID_SDK=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-30" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Haxe and Neko
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y neko libvlc-dev libvlccore-dev
          curl -L --fail https://github.com/HaxeFoundation/haxe/releases/download/4.3.4/haxe-4.3.4-linux64.tar.gz -o /tmp/haxe.tar.gz
          sudo rm -rf /opt/haxe
          sudo mkdir -p /opt/haxe
          sudo tar -xzf /tmp/haxe.tar.gz -C /opt/haxe --strip-components=1
          echo "/opt/haxe" >> "$GITHUB_PATH"
          echo "HAXE_STD_PATH=/opt/haxe/std" >> "$GITHUB_ENV"
          export PATH="/opt/haxe:$PATH"
          export HAXE_STD_PATH="/opt/haxe/std"
          haxe --version
          haxelib version

      - name: Install Haxe dependencies
        run: |
          haxelib setup "$HOME/haxelib"
          sh ./setup/unix.sh

      - name: Prepare Lime Android
        run: haxelib run lime setup android

      - name: Create version
        run: echo "0.1.0-${{ github.run_number }}" > VERSION

      - name: Compile Android APK
        run: haxelib run lime build Project.xml android --app-version="0.1.0-${{ github.run_number }}" -D officialBuild

      - name: Stage Android artifact
        run: |
          set -e
          mkdir -p build-artifacts/android
          find export -type f -name '*.apk' -print -exec cp -f {} build-artifacts/android/ \;
          test -n "$(find build-artifacts/android -type f -name '*.apk' -print -quit)"

      - name: Publish Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: AcornEngine-Android
          path: build-artifacts/android/*.apk
          if-no-files-found: error
