name: Acorn Engine Build

on:
  push:
    branches: [main, experimental]
  pull_request:
    branches: [main, experimental]
  workflow_dispatch:

# Actions must be allowed to read the repository and publish build artifacts.
permissions:
  contents: read

concurrency:
  group: acorn-engine-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildLinux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Haxe
        run: |
          curl -L --fail https://github.com/HaxeFoundation/haxe/releases/download/4.3.4/haxe-4.3.4-linux64.tar.gz -o /tmp/haxe.tar.gz
          sudo mkdir -p /opt/haxe
          sudo tar -xzf /tmp/haxe.tar.gz -C /opt/haxe --strip-components=1
          echo "/opt/haxe" >> "$GITHUB_PATH"
          haxe --version
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libvlc-dev libvlccore-dev
      - name: Install Haxe dependencies
        run: |
          haxelib setup ~/haxelib
          sh ./setup/unix.sh
      - name: Create version
        run: echo "0.1.0-${{ github.run_number }}" > VERSION
      - name: Compile Linux
        run: haxelib run lime build Project.xml linux --app-version="0.1.0-${{ github.run_number }}" -D officialBuild
      - name: Publish Linux build
        uses: actions/upload-artifact@v4
        with:
          name: AcornEngine-Linux
          path: export/release/linux/bin
          if-no-files-found: error
