name: Acorn Actions Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner
        run: |
          echo "GitHub Actions runner is working."
          test -f Project.xml
